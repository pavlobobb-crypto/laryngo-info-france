<details>

<summary>🔬 Comprendre le cancer du larynx</summary>

<p>
Le cancer du larynx se développe à partir des cellules qui composent les différentes régions du larynx.
</p>

<p>
Selon sa localisation, les symptômes et les traitements peuvent être différents.
</p>

<div class="gallery-image">

<img
src="images/zones-larynx-cancer.webp"
alt="Les différentes régions anatomiques du larynx"
loading="lazy">

<em>
Localisation possible des cancers dans les différentes régions du larynx.
</em>

</div>

<p>
La position de la tumeur aide les médecins à choisir la stratégie thérapeutique la plus adaptée.
</p>

</details>

<details>

<summary>📈 Évolution d'une tumeur du larynx</summary>

<div class="gallery-image">

<img
src="images/evolution-tumeur-larynx.webp"
alt="Évolution progressive d'une tumeur du larynx"
loading="lazy">

<em>
Illustration pédagogique montrant l'évolution possible d'une tumeur dans le larynx.
</em>

</div>

<p>
Toutes les tumeurs ne se ressemblent pas.
</p>

<p>
Certaines restent localisées tandis que d'autres peuvent s'étendre aux structures voisines.
</p>

<p>
Chaque situation nécessite donc une évaluation personnalisée.
</p>

</details>

<details>

<summary>⚠️ Les symptômes qui doivent alerter</summary>

<p>
Les symptômes dépendent souvent de la zone touchée.
</p>

<p>
Les signes les plus fréquents sont :
</p>

<p>
✅ Enrouement persistant.
</p>

<p>
✅ Modification inhabituelle de la voix.
</p>

<p>
✅ Difficultés à avaler.
</p>

<p>
✅ Sensation de gêne dans la gorge.
</p>

<p>
✅ Difficultés respiratoires.
</p>

<p>
✅ Apparition d'un ganglion dans le cou.
</p>

<p>
Ces symptômes ne signifient pas forcément qu'il s'agit d'un cancer mais justifient un avis médical lorsqu'ils persistent.
</p>

</details>

<details>

<summary>🔎 Du symptôme au diagnostic</summary>

<div class="gallery-image">

<img
src="images/parcours-diagnostic-larynx.webp"
alt="Parcours diagnostique du cancer du larynx"
loading="lazy">

<em>
Les principales étapes menant au diagnostic.
</em>

</div>

<p>
Le diagnostic repose sur plusieurs étapes complémentaires.
</p>

<p>
Le but est de confirmer la maladie et d'évaluer précisément son extension.
</p>

</details>

<details>

<summary>🩺 La fibroscopie du larynx</summary>

<div class="gallery-image">

<img
src="images/fibroscopie-larynx.webp"
alt="Fibroscopie du larynx"
loading="lazy">

<em>
Examen permettant d'observer directement le larynx et les cordes vocales.
</em>

</div>

<p>
La fibroscopie est un examen couramment réalisé en ORL.
</p>

<p>
Elle permet d'observer directement les structures situées à l'intérieur du larynx.
</p>

<p>
Cet examen joue souvent un rôle essentiel dans le diagnostic.
</p>

</details>

<details>

<summary>🖥 Les examens d'imagerie</summary>

<div class="gallery-image">

<img
src="images/imagerie-larynx.webp"
alt="Examens d'imagerie médicale du larynx"
loading="lazy">

<em>
Scanner, IRM ou autres examens d'imagerie selon les besoins.
</em>

</div>

<p>
Les examens d'imagerie permettent d'obtenir une vision plus complète de la maladie.
</p>

<p>
Selon les situations, l'équipe médicale peut demander :
</p>

<p>
✅ Un scanner.
</p>

<p>
✅ Une IRM.
</p>

<p>
✅ Un TEP Scan.
</p>

<p>
Ces examens aident à mieux comprendre la taille de la tumeur et son éventuelle extension.
</p>

</details>

<details>

<summary>🔬 Pourquoi réaliser une biopsie ?</summary>

<p>
La biopsie consiste à prélever un petit fragment de tissu afin de l'analyser au microscope.
</p>

<p>
Cet examen permet de confirmer précisément la nature des cellules observées.
</p>

<p>
Il contribue à établir le diagnostic définitif.
</p>

</details>

<details>

<summary>👨‍⚕️ Réunion de Concertation Pluridisciplinaire (RCP)</summary>

<div class="gallery-image">

<img
src="images/reunion-pluridisciplinaire.webp"
alt="Réunion de Concertation Pluridisciplinaire"
loading="lazy">

<em>
Plusieurs spécialistes analysent ensemble le dossier médical du patient.
</em>

</div>

<p>
Avant toute décision importante, le dossier est généralement présenté en Réunion de Concertation Pluridisciplinaire.
</p>

<p>
Plusieurs professionnels participent à cette réflexion :
</p>

<p>
✅ Chirurgien ORL.
</p>

<p>
✅ Oncologue.
</p>

<p>
✅ Radiothérapeute.
</p>

<p>
✅ Radiologue.
</p>

<p>
✅ Anatomopathologiste.
</p>

<p>
✅ Orthophoniste selon les situations.
</p>

<p>
L'objectif est de proposer la prise en charge la plus adaptée.
</p>

</details>

<details>

<summary>💡 Ce qu'il faut retenir</summary>

<p>
Un cancer du larynx n'entraîne pas automatiquement une laryngectomie totale.
</p>

<p>
Le traitement dépend de nombreux éléments :
</p>

<p>
✅ La localisation de la tumeur.
</p>

<p>
✅ Sa taille.
</p>

<p>
✅ Son extension.
</p>

<p>
✅ L'état général du patient.
</p>

<p>
✅ Les décisions prises par l'équipe multidisciplinaire.
</p>

<p>
Chaque situation médicale est unique.
</p>

</details>

<hr> 
<details>

<summary>🏥 Les principaux traitements</summary>

<p>
Le traitement proposé dépend des caractéristiques de la maladie et de la situation propre à chaque patient.
</p>

<div class="gallery-image">

<img
src="images/traitements-larynx.webp"
alt="Principaux traitements du cancer du larynx"
loading="lazy">

<em>
Présentation simplifiée des principales stratégies thérapeutiques.
</em>

</div>

<p>
Plusieurs approches peuvent être utilisées seules ou associées :
</p>

<p>
✅ Chirurgie.
</p>

<p>
✅ Radiothérapie.
</p>

<p>
✅ Chimiothérapie.
</p>

<p>
✅ Immunothérapie dans certaines situations.
</p>

<p>
✅ Combinaison de plusieurs traitements.
</p>

</details>

<details>

<summary>📋 Pourquoi les traitements varient-ils ?</summary>

<p>
Chaque cancer est différent.
</p>

<p>
La stratégie médicale dépend notamment :
</p>

<p>
✅ De la localisation de la tumeur.
</p>

<p>
✅ De sa taille.
</p>

<p>
✅ De son extension éventuelle.
</p>

<p>
✅ De l'état général du patient.
</p>

<p>
✅ Des objectifs thérapeutiques définis avec l'équipe médicale.
</p>

<p>
C'est pourquoi deux personnes atteintes d'un cancer du larynx peuvent recevoir des traitements complètement différents.
</p>

</details>

<details>

<summary>✂️ La chirurgie</summary>

<div class="gallery-image">

<img
src="images/chirurgie-larynx.webp"
alt="Exemples de chirurgie du larynx"
loading="lazy">

<em>
Les interventions chirurgicales sont adaptées à chaque situation médicale.
</em>

</div>

<p>
Lorsque cela est possible, certaines interventions permettent de conserver tout ou partie du larynx.
</p>

<p>
Dans d'autres situations, une chirurgie plus importante peut être nécessaire afin de traiter la maladie.
</p>

<p>
Le choix dépend toujours des caractéristiques du cancer et des objectifs de traitement.
</p>

</details>

<details>

<summary>💡 Une idée reçue fréquente</summary>

<p>
Un cancer du larynx ne conduit pas automatiquement à une laryngectomie totale.
</p>

<p>
De nombreuses personnes sont traitées par d'autres techniques ou par des interventions conservatrices.
</p>

<p>
La laryngectomie totale n'est proposée que dans certaines situations particulières.
</p>

</details>

<details>

<summary>🩺 Comprendre la laryngectomie totale</summary>

<p>
La laryngectomie totale consiste à retirer l'ensemble du larynx.
</p>

<p>
Cette opération est parfois nécessaire lorsque les autres options ne permettent plus d'obtenir un contrôle satisfaisant de la maladie.
</p>

<div class="gallery-image">

<img
src="images/laryngectomie-principe.webp"
alt="Principe de la laryngectomie totale"
loading="lazy">

<em>
Principe général de la laryngectomie totale.
</em>

</div>

<p>
L'intervention entraîne une séparation définitive entre les voies respiratoires et les voies digestives.
</p>

</details>

<details>

<summary>🎯 Pourquoi réaliser cette opération ?</summary>

<p>
L'objectif principal est le traitement de la maladie.
</p>

<p>
Dans certaines situations, cette intervention offre les meilleures chances de contrôle du cancer.
</p>

<p>
La décision est toujours prise après une analyse complète du dossier médical et une discussion avec le patient.
</p>

</details>

<details>

<summary>🔄 Avant / Après l'opération</summary>

<div class="gallery-image">

<img
src="images/comparatif-anatomie-avant-apres.webp"
alt="Comparaison anatomique avant et après une laryngectomie totale"
loading="lazy">

<em>
Comparaison simplifiée entre l'anatomie avant et après l'intervention.
</em>

</div>

<p>
Avant l'opération :
</p>

<p>
✅ Respiration par le nez et la bouche.
</p>

<p>
✅ Présence des cordes vocales.
</p>

<p>
✅ Production de la voix naturelle.
</p>

<p>
Après l'opération :
</p>

<p>
✅ Respiration par le cou.
</p>

<p>
✅ Disparition des cordes vocales.
</p>

<p>
✅ Mise en place d'autres moyens de communication.
</p>

</details>

<details>

<summary>💙 Ce qu'il faut retenir</summary>

<p>
Une laryngectomie totale modifie profondément la manière de respirer et de communiquer.
</p>

<p>
Cependant, elle ne signifie pas la fin de l'autonomie, de la vie sociale ou de la communication.
</p>

<p>
Une période de rééducation et d'adaptation permet progressivement de retrouver de nouveaux repères.
</p>

</details>

<hr> 
<details>

<summary>🫁 Pourquoi respire-t-on par le cou ?</summary>

<p>
Après une laryngectomie totale, la trachée n'est plus reliée au nez ni à la bouche.
</p>

<p>
La respiration se fait désormais par une ouverture permanente située à la base du cou.
</p>

<div class="gallery-image">

<img
src="images/respiration-cou.webp"
alt="Respiration par le cou après une laryngectomie totale"
loading="lazy">

<em>
Nouveau trajet de l'air après une laryngectomie totale.
</em>

</div>

<p>
L'air entre directement dans la trachée puis rejoint les poumons.
</p>

<p>
Cette modification anatomique est définitive.
</p>

</details>

<details>

<summary>🫁 Le trachéostome</summary>

<p>
Le trachéostome est l'ouverture respiratoire permanente créée après l'intervention.
</p>

<div class="gallery-image">

<img
src="images/tracheostome-reel.webp"
alt="Aspect général d'un trachéostome"
loading="lazy">

<em>
Exemple pédagogique d'un trachéostome avec dispositif respiratoire.
</em>

</div>

<p>
Le trachéostome devient l'unique voie permettant à l'air d'atteindre les poumons.
</p>

<p>
Il nécessite un entretien régulier et l'utilisation éventuelle de dispositifs adaptés.
</p>

</details>

<details>

<summary>🚨 Information vitale</summary>

<p>
Après une laryngectomie totale :
</p>

<p>
✅ La respiration se fait par le cou.
</p>

<p>
❌ Le nez ne permet plus de respirer.
</p>

<p>
❌ La bouche ne permet plus de respirer.
</p>

<p>
Cette information est essentielle pour les proches, les aidants et les professionnels susceptibles d'intervenir en urgence.
</p>

</details>

<details>

<summary>🍽 Peut-on encore manger après l'opération ?</summary>

<p>
Oui.
</p>

<p>
Après une laryngectomie totale, les aliments continuent à emprunter l'œsophage pour rejoindre l'estomac.
</p>

<div class="gallery-image">

<img
src="images/deglutition-apres-laryngectomie.webp"
alt="Déglutition après une laryngectomie totale"
loading="lazy">

<em>
Le trajet des aliments reste distinct de la voie respiratoire.
</em>

</div>

<p>
Une période d'adaptation ou de rééducation peut être nécessaire selon les situations.
</p>

<p>
De nombreuses personnes retrouvent ensuite une alimentation satisfaisante.
</p>

</details>

<details>

<summary>👃 Pourquoi l'odorat peut-il être modifié ?</summary>

<p>
Après l'opération, l'air n'entre plus naturellement par le nez.
</p>

<div class="gallery-image">

<img
src="images/odorat-laryngectomie.webp"
alt="Modification de l'odorat après laryngectomie"
loading="lazy">

<em>
L'absence de passage naturel de l'air dans le nez peut diminuer la perception des odeurs.
</em>

</div>

<p>
Certaines personnes constatent une diminution de leur odorat.
</p>

<p>
Le goût pouvant être lié à l'odorat, certaines saveurs peuvent également sembler modifiées.
</p>

</details>

<details>

<summary>🌬 Adaptation respiratoire</summary>

<p>
Les premières semaines permettent progressivement d'apprendre de nouveaux gestes respiratoires.
</p>

<div class="gallery-image">

<img
src="images/rehabilitation-respiratoire.webp"
alt="Réadaptation respiratoire après laryngectomie"
loading="lazy">

<em>
La période d'adaptation respiratoire constitue une étape importante de la récupération.
</em>

</div>

<p>
L'objectif est de retrouver un confort respiratoire satisfaisant tout en apprenant à utiliser le matériel adapté.
</p>

<p>
Cette évolution est progressive et varie d'une personne à l'autre.
</p>

</details>

<details>

<summary>✅ Les changements les plus importants</summary>

<p>
Après une laryngectomie totale :
</p>

<p>
✅ La respiration se fait exclusivement par le cou.
</p>

<p>
✅ Le trachéostome devient la seule voie respiratoire.
</p>

<p>
✅ Les aliments continuent de passer par l'œsophage.
</p>

<p>
✅ L'odorat peut être modifié.
</p>

<p>
✅ Une période d'adaptation est nécessaire.
</p>

<p>
✅ Une vie active reste possible après rééducation.
</p>

</details>

<hr> 
<details>

<summary>🌬 Les filtres HME</summary>

<p>
Après une laryngectomie totale, l'air inspiré n'est plus filtré naturellement par le nez.
</p>

<p>
Les filtres HME (Heat and Moisture Exchanger) permettent d'améliorer le confort respiratoire quotidien.
</p>

<div class="gallery-image">

<img
src="images/hme-fonctionnement.webp"
alt="Fonctionnement d'un filtre HME"
loading="lazy">

<em>
Les filtres HME participent à l'humidification et au réchauffement de l'air inspiré.
</em>

</div>

<p>
Ces dispositifs sont aujourd'hui largement utilisés dans la réhabilitation respiratoire après une laryngectomie totale.
</p>

</details>

<details>

<summary>✅ Pourquoi utiliser un HME ?</summary>

<p>
L'utilisation régulière d'un HME permet souvent :
</p>

<p>
✅ Une meilleure humidification de l'air.
</p>

<p>
✅ Une diminution des irritations respiratoires.
</p>

<p>
✅ Une réduction de certaines sécrétions.
</p>

<p>
✅ Une amélioration du confort quotidien.
</p>

<p>
✅ Une meilleure tolérance des activités courantes.
</p>

</details>

<details>

<summary>🧰 Le matériel utilisé au quotidien</summary>

<div class="gallery-image">

<img
src="images/materiel-laryngectomie.webp"
alt="Matériel utilisé après laryngectomie"
loading="lazy">

<em>
Exemple de matériel fréquemment utilisé après une laryngectomie totale.
</em>

</div>

<p>
Selon les besoins de chacun, plusieurs dispositifs peuvent être utilisés :
</p>

<p>
✅ Filtres HME.
</p>

<p>
✅ Adhésifs de fixation.
</p>

<p>
✅ LaryTube.
</p>

<p>
✅ LaryButton.
</p>

<p>
✅ Matériel d'entretien et de nettoyage.
</p>

<p>
✅ Accessoires de communication.
</p>

</details>

<details>

<summary>🗣 Retrouver une communication orale</summary>

<p>
Même après l'ablation du larynx, plusieurs solutions permettent de retrouver une communication efficace.
</p>

<div class="gallery-image">

<img
src="images/solutions-communication-laryngectomie.webp"
alt="Solutions de communication après laryngectomie"
loading="lazy">

<em>
Les principales méthodes de communication disponibles après l'opération.
</em>

</div>

<p>
Chaque méthode possède ses avantages et ses limites.
</p>

<p>
Le choix dépend des préférences du patient et des recommandations de l'équipe spécialisée.
</p>

</details>

<details>

<summary>🎤 La prothèse phonatoire</summary>

<div class="gallery-image">

<img
src="images/prothese-phonatoire.webp"
alt="Principe de la prothèse phonatoire"
loading="lazy">

<em>
La prothèse phonatoire utilise l'air pulmonaire pour produire une nouvelle voix.
</em>

</div>

<p>
La prothèse phonatoire est aujourd'hui l'une des solutions les plus utilisées.
</p>

<p>
Elle permet à de nombreuses personnes de retrouver une communication orale efficace après l'opération.
</p>

</details>

<details>

<summary>🗨 La voix œsophagienne</summary>

<div class="gallery-image">

<img
src="images/voix-oesophagienne.webp"
alt="Voix œsophagienne"
loading="lazy">

<em>
La voix œsophagienne repose sur l'utilisation de l'air contenu dans l'œsophage.
</em>

</div>

<p>
Cette méthode ne nécessite aucun appareil externe.
</p>

<p>
Son apprentissage demande généralement un entraînement régulier avec l'accompagnement d'un orthophoniste.
</p>

</details>

<details>

<summary>📢 L'électrolarynx</summary>

<div class="gallery-image">

<img
src="images/electrolarynx.webp"
alt="Utilisation d'un électrolarynx"
loading="lazy">

<em>
L'électrolarynx produit une vibration artificielle transformée en parole.
</em>

</div>

<p>
L'électrolarynx constitue une autre possibilité de communication.
</p>

<p>
Il peut être utilisé temporairement ou durablement selon les besoins de chacun.
</p>

</details>

<details>

<summary>👩‍⚕️ Le rôle de l'orthophoniste</summary>

<div class="gallery-image">

<img
src="images/orthophonie-laryngectomie.webp"
alt="Rééducation orthophonique après laryngectomie"
loading="lazy">

<em>
L'orthophoniste accompagne l'apprentissage des nouvelles techniques de communication.
</em>

</div>

<p>
L'orthophoniste joue un rôle central dans la récupération après l'intervention.
</p>

<p>
Les objectifs principaux sont :
</p>

<p>
✅ Retrouver une communication fonctionnelle.
</p>

<p>
✅ Développer l'autonomie.
</p>

<p>
✅ Améliorer l'intelligibilité de la parole.
</p>

<p>
✅ Faciliter les échanges sociaux et familiaux.
</p>

</details>

<details>

<summary>💡 Ce qu'il faut retenir</summary>

<p>
La disparition de la voix naturelle ne signifie pas la disparition de la communication.
</p>

<p>
Plusieurs solutions existent aujourd'hui pour permettre aux personnes laryngectomisées de retrouver une communication orale.
</p>

<p>
L'accompagnement par les professionnels spécialisés joue un rôle essentiel dans cette rééducation.
</p>

</details>

<hr> 
<details>

<summary>🌈 Une nouvelle vie est possible</summary>

<p>
Une laryngectomie totale entraîne des changements importants mais n'empêche pas de retrouver une vie active.
</p>

<div class="gallery-image">

<img
src="images/vie-quotidienne-laryngectomie.webp"
alt="Vie quotidienne après une laryngectomie totale"
loading="lazy">

<em>
La réadaptation permet progressivement de retrouver de nombreux aspects de la vie quotidienne.
</em>

</div>

<p>
De nombreuses personnes reprennent progressivement leurs activités familiales, sociales et parfois professionnelles.
</p>

<p>
Chaque parcours reste unique et évolue à son propre rythme.
</p>

</details>

<details>

<summary>🚶 Activité physique et loisirs</summary>

<p>
Après la période de récupération, de nombreux patients reprennent progressivement une activité physique adaptée.
</p>

<p>
Selon les recommandations de l'équipe médicale :
</p>

<p>
✅ Marche.
</p>

<p>
✅ Jardinage.
</p>

<p>
✅ Bricolage.
</p>

<p>
✅ Voyages.
</p>

<p>
✅ Activités associatives.
</p>

<p>
✅ Activités sportives adaptées.
</p>

<p>
L'objectif est de retrouver progressivement autonomie et qualité de vie.
</p>

</details>

<details>

<summary>✈️ Voyager après une laryngectomie</summary>

<p>
Les voyages restent tout à fait possibles après une laryngectomie totale.
</p>

<p>
Quelques précautions simples permettent de voyager plus sereinement :
</p>

<p>
✅ Prévoir suffisamment de matériel.
</p>

<p>
✅ Conserver les informations médicales importantes.
</p>

<p>
✅ Emporter une carte ou une fiche d'urgence.
</p>

<p>
✅ Prévoir les coordonnées des professionnels de santé utiles si nécessaire.
</p>

</details>

<details>

<summary>❤️ Le rôle des proches et des aidants</summary>

<p>
Les proches occupent souvent une place essentielle dans la période d'adaptation.
</p>

<p>
Ils peuvent contribuer à :
</p>

<p>
✅ Comprendre les informations médicales.
</p>

<p>
✅ Accompagner les rendez-vous.
</p>

<p>
✅ Faciliter l'apprentissage des nouveaux gestes.
</p>

<p>
✅ Soutenir la rééducation.
</p>

<p>
✅ Favoriser le retour aux activités habituelles.
</p>

</details>

<details>

<summary>🚨 Information vitale pour les urgences</summary>

<p>
Après une laryngectomie totale :
</p>

<p>
✅ La respiration se fait exclusivement par le cou.
</p>

<p>
❌ Le nez ne permet plus de respirer.
</p>

<p>
❌ La bouche ne permet plus de respirer.
</p>

<em>
Information importante destinée aux proches, secouristes et professionnels de santé.
</em>

</div>

<p>
Cette caractéristique doit être connue de toute personne susceptible d'intervenir en situation d'urgence.
</p>

</details>

<details>

<summary>🪪 Carte et fiche d'urgence</summary>

<p>
De nombreuses personnes choisissent de conserver une fiche ou une carte d'information médicale.
</p>

<p>
Les informations fréquemment mentionnées sont :
</p>

<p>
✅ Laryngectomie totale.
</p>

<p>
✅ Respiration par le cou.
</p>

<p>
✅ Coordonnées des proches.
</p>

<p>
✅ Coordonnées du centre de référence.
</p>

<p>
✅ Informations médicales importantes.
</p>

</details>

<details>

<summary>⚠️ Mise en garde médicale</summary>

<p>
Cette galerie a un objectif pédagogique et informatif.
</p>

<p>
Elle ne remplace jamais une consultation médicale ni les recommandations données par les professionnels qui suivent le patient.
</p>

<p>
Les traitements, les complications possibles et les conseils personnalisés doivent toujours être discutés avec l'équipe soignante.
</p>

<p>
En cas de difficulté respiratoire ou de situation médicale préoccupante, il convient de contacter les services de santé appropriés.
</p>

</details>

<details>

<summary>📚 Références médicales</summary>

<p>
Les informations présentées dans cette galerie s'appuient notamment sur les ressources suivantes :
</p>

<ul>

<li>Institut National du Cancer (INCa).</li>

<li>Assurance Maladie (ameli.fr).</li>

<li>National Cancer Institute (NCI).</li>

<li>American Cancer Society.</li>

<li>Atos Medical.</li>

<li>European Head and Neck Society (EHNS).</li>

<li>Guides de réhabilitation et de rééducation après laryngectomie totale.</li>

</ul>

<p>
Les connaissances médicales évoluant continuellement, certaines recommandations peuvent être actualisées au fil du temps.
</p>

</details>

<details open>

<summary>💙 Message de fin</summary>

<p>
Comprendre le cancer du larynx et la laryngectomie totale demande du temps.
</p>

<p>
Cette galerie a été créée afin de rendre plus accessibles certaines notions parfois complexes abordées pendant le parcours de soins.
</p>

<p>
