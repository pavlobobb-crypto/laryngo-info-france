<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Carte d'Urgence Laryngectomie Totale</title>

<style>

@page {
    size: 140mm 90mm;
    margin: 0;
}

body{
    margin:0;
    padding:15mm;
    font-family:Arial, Helvetica, sans-serif;
    background:white;
}

.carte{

    width:140mm;
    height:90mm;

    border:2px solid #000;

    display:flex;

    position:relative;

    margin:auto;
}

/* Trait de pliage */

.carte::after{

    content:"";

    position:absolute;

    left:70mm;
    top:0;

    height:100%;

    border-left:2px dashed #666;
}

/* Volets */

.volet{

    width:70mm;
    height:90mm;

    box-sizing:border-box;
}

/* Partie urgence */

.urgence{

    background:#c00000;
    color:white;

    text-align:center;

    padding:8mm;
}

.urgence h1{

    margin-top:0;
    margin-bottom:10mm;

    font-size:24px;
}

.respire{

    font-size:30px;

    font-weight:bold;

    line-height:1.1;

    margin-bottom:10mm;
}

.info{

    font-size:14px;

    font-weight:bold;

    line-height:1.8;
}

/* Partie contact */

.contact{

    background:white;

    color:black;

    padding:8mm;
}

.label{

    font-size:16px;

    font-weight:bold;

    margin-top:8mm;
}

.ligne{

    margin-top:4mm;

    border-bottom:2px solid black;

    height:8mm;
}

.instructions{

    text-align:center;

    margin-top:8px;

    color:#666;

    font-size:12px;
}

@media print {

body{
    padding:0;
}

.instructions{
    display:none;
}

}

</style>

</head>

<body>

<div class="carte">

    <div class="volet urgence">

        <h1>🚨 URGENCE</h1>

        <div class="respire">

            JE RESPIRE<br>
            PAR LE COU

        </div>

        <div class="info">

            LARYNGECTOMIE TOTALE

            <br><br>

            PAS DE RESPIRATION PAR LE NEZ

            <br><br>

            PAS DE RESPIRATION PAR LA BOUCHE

        </div>

    </div>

    <div class="volet contact">

        <div class="label">
            PERSONNE À PRÉVENIR :
        </div>

        <div class="ligne"></div>

        <div class="label">
            CONTACT :
        </div>

        <div class="ligne"></div>

        <div class="label">
            TÉLÉPHONE :
        </div>

        <div class="ligne"></div>

    </div>

</div>

<div class="instructions">
✂️ Imprimer, plier sur le pointillé central et plastifier si souhaité.
</div>

</body>
</html>
