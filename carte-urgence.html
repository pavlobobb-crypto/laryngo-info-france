<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Carte Urgence Laryngectomie</title>

<style>

@page{
    size:85mm 54mm;
    margin:0;
}

body{
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
}

/* RECTO */

.recto{
    width:85mm;
    height:54mm;
    background:#c00000;
    color:white;
    box-sizing:border-box;
    padding:3mm;
    page-break-after:always;
}

.recto h1{
    margin:0 0 2mm 0;
    text-align:center;
    font-size:16pt;
}

.urgence{
    text-align:center;
    font-size:20pt;
    font-weight:bold;
    line-height:1.1;
    margin-bottom:2mm;
}

.recto p{
    margin:1mm 0;
    font-size:9pt;
    font-weight:bold;
}

/* VERSO */

.verso{
    width:85mm;
    height:54mm;
    background:white;
    color:black;
    box-sizing:border-box;
    padding:4mm;
    border:2px solid #c00000;
}

.verso h2{
    margin:0 0 4mm 0;
    color:#c00000;
    text-align:center;
    font-size:14pt;
}

.ligne{
    margin-top:3mm;
    margin-bottom:5mm;
    border-bottom:1px solid black;
    height:5mm;
}

.label{
    font-weight:bold;
    font-size:10pt;
}

</style>

</head>

<body>

<div class="recto">

<h1>🚨 URGENCE</h1>

<div class="urgence">

</div>

</div>

</body>
</html>
