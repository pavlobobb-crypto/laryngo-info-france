<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<title>Carte d'Urgence - Laryngectomie Totale</title>

<style>

@page{
    size:140mm 90mm;
    margin:0;
}

html,
body{
    margin:0;
    padding:0;
    background:white;
    font-family:Arial, Helvetica, sans-serif;
}

/* Bouton impression */

.print-button{

    text-align:center;

    margin:15px;
}

.print-button button{

    background:#c00000;
    color:white;

    border:none;

    border-radius:8px;

    padding:12px 25px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;
}

/* Carte */

.carte{

    width:140mm;
    height:90mm;

    border:2px solid #000;

    display:flex;

    position:relative;

    margin:0 auto;
}

/* Repère de pliage */

.carte::after{

    content:"";

    position:absolute;

    top:0;
    left:70mm;

    height:100%;

    border-left:2px dashed #444;
}

/* Partie rouge */

.urgence{

    width:70mm;
    height:90mm;

    background:#c00000;

    color:white;

    box-sizing:border-box;

    padding:8mm;

    text-align:center;
}

.urgence h1{

    margin:0 0 8mm 0;

    font-size:24px;
}

.respire{

    font-size:26px;

    font-weight:bold;

    line-height:1.1;

    margin-bottom:8mm;
}

.info{

    font-size:13px;

    font-weight:bold;

    line-height:1.6;
}

/* Partie blanche */

.contact{

    width:70mm;
    height:90mm;

    background:white;

    color:black;

    box-sizing:border-box;

    padding:8mm;
}

.label{

    font-size:15px;

    font-weight:bold;

    margin-top:8mm;
}

.ligne{

    margin-top:4mm;

    border-bottom:2px solid black;

    height:8mm;
}

.instructions{

    text-align:center;

    margin-top:10px;

    color:#666;

    font-size:12px;
}

/* Impression */

@media print{

    html,
    body{
        margin:0;
        padding:0;
    }

    .print-button{
        display:none;
    }

    .instructions{
        display:none;
    }

    .carte{
        margin:0;
        page-break-inside:avoid;
    }

}

</style>

</head>

<body>

<div class="print-button">

<button onclick="window.print();">

🖨️ IMPRIMER LA CARTE

</button>

</div>

<div class="carte">

<div class="urgence">

<h1>URGENCE</h1>

<div class="respire">

JE RESPIRE<br>
PAR LE COU

</div>

<div class="info">

LARYNGECTOMIE TOTALE

<br><br>

❌ PAS DE RESPIRATION PAR LE NEZ

<br><br>

❌ PAS DE RESPIRATION PAR LA BOUCHE

<br><br>

✅ TRACHÉOSTOME =

SEULE VOIE RESPIRATOIRE

</div>

</div>

<div class="contact">

<div class="label">

PERSONNE À PRÉVENIR :

</div>

<div class="ligne"></div>

<div class="label">

CONTACT :

</div>

<div class="ligne"></div>

<div class="label">

TÉLÉPHONE :

</div>

<div class="ligne"></div>

</div>

</div>

<div class="instructions">

Plier sur la ligne pointillée centrale.

</div>

</body>
</html>
