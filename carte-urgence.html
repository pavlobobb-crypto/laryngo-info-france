<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>Carte d'Urgence - Laryngectomie Totale</title>

<style>

@page {
    size: 140mm 90mm;
    margin: 0;
}

body{
    margin:0;
    padding:15mm;
    font-family:Arial, Helvetica, sans-serif;
    background:white;
}

.carte{

    width:140mm;
    height:90mm;

    border:2px solid #000;

    display:flex;

    position:relative;

    margin:auto;
}

/* Trait de pliage */

.carte::after{

    content:"";

    position:absolute;

    left:70mm;
    top:0;

    height:100%;

    border-left:2px dashed #444;
}

/* Volet rouge */

.urgence{

    width:70mm;

    background:#c00000;

    color:white;

    text-align:center;

    padding:8mm;

    box-sizing:border-box;
}

.urgence h1{

    margin-top:0;

    margin-bottom:8mm;

    font-size:24px;
}

.respire{

    font-size:26px;

    font-weight:bold;

    line-height:1.1;

    margin-bottom:8mm;
}

.info{

    font-size:13px;

    font-weight:bold;

    line-height:1.6;
}

/* Volet blanc */

.contact{

    width:70mm;

    background:white;

    color:black;

    padding:8mm;

    box-sizing:border-box;
}

.label{

    font-size:15px;

    font-weight:bold;

    margin-top:7mm;
}

.ligne{

    margin-top:3mm;

    border-bottom:2px solid black;

    height:8mm;
}

/* Bouton impression */

.print-button{

    text-align:center;

    margin-bottom:20px;
}

.print-button button{

    background:#c00000;

    color:white;

    border:none;

    padding:12px 25px;

    font-size:18px;

    font-weight:bold;

    border-radius:8px;

    cursor:pointer;
}

/* Texte aide */

.instructions{

    text-align:center;

    margin-top:10px;

    color:#666;

    font-size:12px;
}

/* Impression */

@media print {

body{
    padding:0;
}

.print-button{
    display:none;
}

.instructions{
    display:none;
}

}

</style>

</head>

<body>

<div class="print-button">

<button onclick="window.print();">

🖨️ IMPRIMER LA CARTE

</button>

</div>

<div class="carte">

<div class="urgence">

<h1>URGENCE</h1>

<div class="respire">

JE RESPIRE<br>
PAR LE COU

</div>

<div class="info">

LARYNGECTOMIE TOTALE

<br><br>

❌ PAS DE RESPIRATION PAR LE NEZ

<br><br>

❌ PAS DE RESPIRATION PAR LA BOUCHE

<br><br>

✅ TRACHÉOSTOME =

SEULE VOIE RESPIRATOIRE

</div>

</div>

<div class="contact">

<div class="label">

PERSONNE À PRÉVENIR :

</div>

<div class="ligne"></div>

<div class="label">

CONTACT :

</div>

<div class="ligne"></div>

<div class="label">

TÉLÉPHONE :

</div>

<div class="ligne"></div>

</div>

</div>

<div class="instructions">

Plier sur la ligne pointillée centrale.

</div>

</body>
</html>
